<style>

.wkw{overflow-x:auto}.tx{color:var(--mu);font-size:13px}

:root{--ai:color-mix(in srgb,var(--ac) 72%,#6e3f4c)}.dk{--ai:var(--ac)}
#ld h1,h1.pg,.card h3,.tm,#nav .dt,.dp b,.md h3{font-family:"Playfair Display",Georgia,serif;font-weight:400}
em{font-style:italic;color:var(--ai)}

.card{border-radius:28px;padding:22px;box-shadow:0 14px 34px -24px rgba(176,116,130,.45);background:var(--card)}

.today{background:linear-gradient(135deg,var(--as),var(--card))}
.mood button,select,input:not([type=checkbox]),textarea{border-radius:99px}textarea{border-radius:20px}
.mood button{background:var(--card);padding:8px 14px}.mood button.on{background:var(--as);color:var(--ai)}
.ch{letter-spacing:.04em}
#nav{width:270px;padding:30px 18px;background:transparent}

.phone .dp{width:56px}.phone h1.pg{font-size:28px}
.tt{border-collapse:separate;border-spacing:4px;min-width:760px;font-size:12px}.tt th{font-weight:500;color:var(--mu);font-size:11px}.tt td{border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center;color:#4a3f42;min-width:70px;border:1px solid var(--ln)}.tt td small{display:block;opacity:.7}.tt th.now{color:var(--ai)}
</style></head><body>
<div id="ld"><div>🌷</div><h1>Organise Me</h1><p>Let's get organised.</p></div>
<div id="app"><nav id="nav"></nav><div id="wrap"><div id="top"><input id="q" placeholder="Search everything…" oninput="sq(this.value)"></div><div id="main"></div></div></div>
<button id="fab" onclick="qa()" aria-label="Quick add">+</button><div id="mdl"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>s?new Date(s+'T12:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'',uid=()=>Math.random().toString(36).slice(2,9);
const MOODS=[['😊','Happy'],['😄','Excited'],['😌','Calm'],['😐','Okay'],['😔','Sad'],['😡','Angry'],['😰','Stressed'],['😴','Tired'],['🤩','Motivated'],['🥱','Bored']];
const PAL=['#f8d7e0','#d5e9dc','#f4ead2','#e3dcf2','#d9e8f2','#f9e0cf','#e8d5e0','#d8e6d0','#f3dcd2','#d0e1ea'],PR={High:0,Medium:1,Low:2};
const TS=[['1','Period 1','08:35','09:40'],['2','Period 2','09:40','10:45'],['HR','Homeroom','10:45','11:00'],['b1','Recess','11:00','11:20'],['3','Period 3','11:20','12:25'],['4','Period 4','12:25','13:30'],['b2','Lunch','13:30','14:10'],['5','Period 5','14:10','15:15']];
const RAW={'1':'07VAR07 H202,07VAR07 H202,07SCI07 C203,07MYB07 I201,07SCI07 F301,07ENG07 S302,07SCI07 C203,07MYB07 F104,07GEO07 F307,07REL07 D203',
'2':'07ENG07 S302,07MAT07 O201,07MAT07 O201,Assembly Hall,07GEO07 F307,07VAR07 H202,07PDH07 M101,07ENG07 S302,07NN D201,07VAR07 H202',
'HR':Array(10).fill('NN3 O203').join(','),
'3':'07GEO07 F307,07ENG07 S302,07PDH07 M101,07SCI07 C204,07REL07 D203,07TMA11 A201,07REL07 D203,07MAT07 O201,07ENG07 S302,07MYB07 F104',
'4':'07TMA11 A201,07GEO07 F307,07PDH07 M101,07ENG07 S302,07MAT07 O201,07MAT07 O201,07MAT07 O201,07SCI07 C203,07MYB07 F104,07TMA11 A201',
'5':'07REL07 D203,07MYB07 F104,07TMA11 A201,07PDH07 M101,07TMA11 A201,Bennies Time,07GEO07 F307,07VAR07 H202,07SCI07 C203,07PDH07 M101'};
const seedTT=()=>{const cells={};Object.keys(RAW).forEach(k=>RAW[k].split(',').forEach((e,i)=>{const m=e.match(/^(.*?)\s*([A-Z]\d{3})$/);cells[(i+1)+'|'+k]=m?{c:m[1],r:m[2]}:e=='Assembly Hall'?{c:'Assembly',r:'Hall'}:{c:e,r:''}}));
 return{start:'2026-10-13',end:'2026-12-03',anchor:'2026-10-12',cells,names:{'07VAR07':'Visual Arts','07SCI07':'Science','07ENG07':'English','07MAT07':'Maths','07GEO07':'Geography','07REL07':'Religion','07PDH07':'PDHPE'}}};
const seedSubj=()=>{const o={};Object.values(seedTT().cells).forEach(x=>{if(x.c&&!['Assembly','Bennies Time','NN3'].includes(x.c)&&!o[x.c])o[x.c]=PAL[Object.keys(o).length%PAL.length]});return o};
const def=()=>({hw:[],todo:[],ev:[],habit:[],routine:[],wlog:[],note:[],rem:[],mood:{},goals:{},refl:{},subj:seedSubj(),tt:seedTT(),tcats:['Personal','Home'],ncats:['Quick notes'],sort:{},
 set:{dev:'auto',dark:0,ac:'#e9a3b7',mon:1,n:{hw:1,ev:1,todo:1,habit:0,refl:1,goals:1,rem:1}},dash:{order:['todos','hw','sched','mood','goals','habits','rem','notes','cal'],hide:[]}});
let S=def(),page='dash',ready=false,dbr=null,selD=today(),cm=[new Date().getFullYear(),new Date().getMonth()],custom=0,rd=today(),svw='week',cview='month',Q='';
try{const l=JSON.parse(localStorage.getItem('om')||'null');if(l)S=Object.assign(def(),l)}catch(e){}
let st;function save(){try{localStorage.setItem('om',JSON.stringify(S))}catch(e){}clearTimeout(st);st=setTimeout(()=>{if(dbr&&ready)dbr.set({json:JSON.stringify(S)}).catch(()=>{})},500)}
(async()=>{try{const u=await claude.use('user'),c=await claude.use('db');if(!u||!c)return;const id=await u.id();dbr=c.collection('data/users/'+id).doc('app');const s=await dbr.get();if(s.exists&&s.data().json){S=Object.assign(def(),JSON.parse(s.data().json));render()}ready=true;save()}catch(e){ready=false}})();
const FD={
hw:{t:'Homework',f:[['subject','Subject','l',()=>[...new Set([...Object.values(S.tt.names),...Object.keys(S.subj)])]],['name','Assignment name'],['desc','Description / instructions','a'],['date','Due date','d'],['time','Due time','m'],['prio','Priority','s',['Low','Medium','High']],['est','Estimated time (mins)','n'],['status','Status','s',['Not started','In progress','Done']],['teacher','Teacher']],d:{prio:'Medium',status:'Not started'}},
todo:{t:'To-do',f:[['name','Task'],['date','Due date','d'],['time','Due time','m'],['prio','Priority','s',['Low','Medium','High']],['cat','Category','l',()=>S.tcats],['notes','Notes / details','a'],['rep','Repeats','s',['None','Daily','Weekly']]],d:{prio:'Medium',rep:'None'}},
ev:{t:'Event',f:[['name','Title'],['date','Date','d'],['time','Start','m'],['end','End','m'],['subject','Subject / label','l',()=>Object.keys(S.subj)],['rep','Repeats','s',['None','Weekly']]],d:{rep:'None'}},
habit:{t:'Habit',f:[['name','Habit name'],['freq','Frequency','s',['Daily','Weekdays','3 times a week','Weekly']]],d:{freq:'Daily'}},
routine:{t:'Routine',f:[['name','Routine name'],['ex','Exercises / plan','a']]},
wlog:{t:'Workout',f:[['name','Workout name / type','l',()=>S.routine.map(r=>r.name)],['date','Date','d'],['dur','Duration (mins)','n'],['done','Completed','s',['Yes','No']],['notes','Notes (optional)','a']],d:{done:'Yes'}},
note:{t:'Note',f:[['title','Title'],['cat','Category','l',()=>S.ncats],['body','Note','a']]},
rem:{t:'Reminder',f:[['name','Reminder'],['date','Date','d'],['time','Time','m']]}};
const nm=i=>i.name||i.title||'Untitled',isDone=(k,i)=>k=='hw'?i.status=='Done':!!i.done;
function openForm(k,id,pre){if(k=='tt')return ttEdit(id);const F=FD[k],it=id?S[k].find(x=>x.id==id):Object.assign({},F.d,{date:(k=='hw'||k=='rem')?'':today()},pre);
 if(k=='hw'||k=='todo')it.date=it.date||(id?'':'');
 let h=`<h3>${id?'Edit':'Add'} ${F.t}</h3>`+F.f.map(([n,l,t,o],j)=>{const v=esc(it[n]??'');let x;
  if(t=='a')x=`<textarea id="f_${n}">${v}</textarea>`;else if(t=='s')x=`<select id="f_${n}">${o.map(z=>`<option ${z==it[n]?'selected':''}>${z}</option>`).join('')}</select>`;
  else x=`<input id="f_${n}" type="${{d:'date',m:'time',n:'number'}[t]||'text'}" value="${v}" ${t=='l'?`list="dl_${n}"`:''}>`+(t=='l'?`<datalist id="dl_${n}">${o().map(z=>`<option>${esc(z)}</option>`).join('')}</datalist>`:'');
  return `<label>${l}</label>${x}`}).join('')+`<div class="bar" style="margin-top:16px"><button class="btn" onclick="sf('${k}','${id||''}')">Save</button><button class="btn g" onclick="cl()">Cancel</button>${id?`<button class="btn g" style="margin-left:auto" onclick="del('${k}','${id}')">Delete</button>`:''}</div>`;
 md(h)}
const md=h=>{$('#mdl').innerHTML=`<div class="ov" onclick="if(event.target==this)cl()"><div class="md">${h}</div></div>`},cl=()=>{$('#mdl').innerHTML=''};
function sf(k,id){const F=FD[k],o={};F.f.forEach(([n])=>o[n]=$('#f_'+n).value.trim());if(!(o.name||o.title)){alert('Please add a name');return}
 if(k=='hw'&&o.subject&&!S.subj[o.subject]){const cd=Object.keys(S.tt.names).find(z=>S.tt.names[z]==o.subject);S.subj[o.subject]=(cd&&S.subj[cd])||PAL[Object.keys(S.subj).length%PAL.length]}
 if(k=='todo'&&o.cat&&!S.tcats.includes(o.cat))S.tcats.push(o.cat);if(k=='note'&&o.cat&&!S.ncats.includes(o.cat))S.ncats.push(o.cat);
 if(id)Object.assign(S[k].find(x=>x.id==id),o);else S[k].push(Object.assign({id:uid()},o));save();cl();render()}
function del(k,id){if(confirm('Delete this?')){S[k]=S[k].filter(x=>x.id!=id);save();cl();render()}}
function tg(k,id){const i=S[k].find(x=>x.id==id);if(k=='hw')i.status=i.status=='Done'?'Not started':'Done';
 else if(k=='todo'&&!i.done&&i.rep&&i.rep!='None'&&i.date)i.date=addD(i.date,i.rep=='Daily'?1:7);else i.done=!i.done;save();render()}
function th(id,d){const h=S.habit.find(x=>x.id==id);h.log=h.log||{};h.log[d]?delete h.log[d]:h.log[d]=1;save();render()}
function sorted(k,l){const s=S.sort[k]||'date',f={date:i=>(i.date||'9999')+(i.time||''),prio:i=>PR[i.prio]??3,cat:i=>i.subject||i.cat||'~',status:i=>isDone(k,i)?1:0}[s];return[...l].sort((a,b)=>f(a)>f(b)?1:f(a)<f(b)?-1:0)}
const chip=i=>i.subject?`<span class="ch" style="background:${S.subj[i.subject]||PAL[1]}">${esc(i.subject)}</span>`:i.cat?`<span class="ch" style="background:var(--gr)">${esc(i.cat)}</span>`:'';
function row(k,i){const d=isDone(k,i);return `<div class="row ${d?'dn':''}"><input type="checkbox" ${d?'checked':''} onchange="tg('${k}','${i.id}')"><div class="rb" onclick="openForm('${k}','${i.id}')"><b>${esc(nm(i))}</b><small>${chip(i)}${i.date?fd(i.date):''} ${i.time||''} ${i.prio?'· '+i.prio:''}${i.est?' · '+i.est+'m':''}</small></div></div>`}
const sortBar=k=>`<select onchange="S.sort.${k}=this.value;save();render()">${[['date','Due date'],['prio','Priority'],['cat',k=='hw'?'Subject':'Category'],['status','Status']].map(([v,l])=>`<option value="${v}" ${(S.sort[k]||'date')==v?'selected':''}>Sort: ${l}</option>`).join('')}</select>`;
function cycDay(d){const T=S.tt,w=new Date(d+'T12:00').getDay();if(!T||d<T.start||d>T.end||w<1||w>5)return 0;const k=Math.round((new Date(addD(d,1-w)+'T12:00')-new Date(T.anchor+'T12:00'))/6048e5);return w+(k%2==0?5:0)}
const cycTxt=d=>{const n=cycDay(d);return fd(d)+(n?` · Day ${n} (Week ${n>5?'B':'A'})`:' · no timetable')};
function ttItems(d){const n=cycDay(d),r=[];if(n)TS.forEach(([k,,a])=>{const c=S.tt.cells[n+'|'+k];if(k[0]!='b'&&c&&c.c)r.push({k:'tt',i:{id:n+'|'+k},t:a,l:c.c+(c.r?' · '+c.r:'')+(S.tt.names[c.c]?' ('+S.tt.names[c.c]+')':''),c:S.subj[c.c]||PAL[[...c.c].reduce((x,y)=>x+y.charCodeAt(0),0)%PAL.length]})});return r}
const ttCodes=()=>[...new Set(Object.values(S.tt.cells).map(x=>x.c))].sort();

 <div class="tg"><span>Dark mode</span><input type="checkbox" ${s.dark?'checked':''} onchange="S.set.dark=+this.checked;save();render()"></div><label>Accent colour</label>${['#e9a3b7','#d98fa8','#9fc9ae','#b9a7dc'].map(c=>`<span class="sw" style="background:${c};${s.ac==c?'border-color:var(--tx)':''}" onclick="S.set.ac='${c}';save();render()"></span>`).join('')}</div>

 <div class="card"><h3>School</h3><label>Subjects & colours</label>${Object.keys(S.subj).map(k=>`<div class="tg"><span>${esc(k)}</span><span><input type="color" style="width:44px;padding:0;height:28px" value="${S.subj[k]}" onchange="S.subj[${JSON.stringify(k).replace(/"/g,'&quot;')}]=this.value;save();render()"> <a onclick="if(confirm('Remove subject?')){delete S.subj[${JSON.stringify(k).replace(/"/g,'&quot;')}];save();render()}" style="cursor:pointer">✕</a></span></div>`).join('')}<button class="btn g s" onclick="var c=prompt('Subject name');if(c){S.subj[c]=PAL[Object.keys(S.subj).length%PAL.length];save();render()}">+ Subject</button>
 <label>To-do categories</label><div class="tx">${S.tcats.map(esc).join(', ')} </div><button class="btn g s" onclick="var c=prompt('Category');if(c){S.tcats.push(c);save();render()}">+ Category</button></div>
 <div class="card"><h3>Schedule</h3><div class="tg"><span>Week starts on Monday</span><input type="checkbox" ${s.mon?'checked':''} onchange="S.set.mon=+this.checked;save();render()"></div><label>Term start</label><input type="date" value="${S.tt.start}" onchange="S.tt.start=this.value;save()"><label>Term last day</label><input type="date" value="${S.tt.end}" onchange="S.tt.end=this.value;save()"><label>Monday of a Week B</label><input type="date" value="${S.tt.anchor}" onchange="S.tt.anchor=this.value;save()"></div>
 <div class="card"><h3>Account & privacy</h3><p class="tx">Your data is saved automatically to your signed-in Claude account${dbr?' (connected ✓)':' (not connected – saved on this device only)'} and is private to you.</p><button class="btn g s" onclick="exp()">Download my data</button> <button class="btn g s" onclick="if(confirm('Erase ALL data?')){S=def();save();render()}">Erase everything</button></div></div>`}};
async function exp(){try{const d=await claude.use('downloads');await d.save({filename:'organise-me.json',data:JSON.stringify(S,null,1)})}catch(e){alert('Download not available here.')}}
function setG(d,v){const old=S.goals[d]||[];S.goals[d]=v.split('\n').map(x=>x.trim()).filter(Boolean).map(t=>({t,done:!!(old.find(o=>o.t==t)||{}).done}));save()}
function sr(){const R={};['well','bad','proud','did','learn','improve','goals','more'].forEach(k=>R[k]=$('#r_'+k).value);S.refl[rd]=R;setG(addD(rd,1),R.goals);alert('Saved ♡ Tomorrow\'s goals are ready.');render()}
const mv=(k,n)=>{const o=S.dash.order,i=o.indexOf(k),j=i+n;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];save();render()},hd=k=>{S.dash.hide.push(k);save();render()};
function qa(){md(`<h3>Quick add</h3><div class="qa"><button onclick="cl();openForm('hw')">📚 Add Homework</button><button onclick="cl();openForm('todo')">✅ Add To-Do</button><button onclick="cl();openForm('ev')">🗓️ Add Event</button><button onclick="go('mood');cl()">💗 Log Mood</button><button onclick="cl();openForm('note')">📝 Add Note</button><button onclick="cl();openForm('wlog')">🏋️ Log Workout</button></div>`)}
const TM={s:25,b:5,r:4,left:1500,ph:'Study',rd:1,on:0,iv:null};
function rt(){clearInterval(TM.iv);Object.assign(TM,{on:0,left:TM.s*60,ph:'Study',rd:1});tu()}
function tu(){const e=$('#tm');if(!e)return;e.textContent=String(Math.floor(TM.left/60)).padStart(2,'0')+':'+String(TM.left%60).padStart(2,'0');$('#tl').textContent=TM.ph+' · round '+TM.rd+' of '+TM.r}
function tst(){if(TM.on)return;if(TM.left<=0)rt();TM.on=1;TM.iv=setInterval(()=>{TM.left--;if(TM.left<=0){if(TM.ph=='Study'){if(TM.rd>=TM.r){clearInterval(TM.iv);TM.on=0;TM.left=0;toast('All rounds done ♡')}else{TM.ph='Break';TM.left=TM.b*60;toast('Break time')}}else{TM.ph='Study';TM.rd++;TM.left=TM.s*60;toast('Back to study')}}tu()},1000)}
const tp=()=>{clearInterval(TM.iv);TM.on=0};tm_=0;rt();
function delRem(id){S.rem=S.rem.filter(r=>r.id!=id);save();render()}
function toast(t){try{if(window.Notification&&Notification.permission=='granted')new Notification('Organise Me',{body:t})}catch(e){}const d=document.createElement('div');d.innerHTML='🌷 '+esc(t)+' <a style="cursor:pointer;margin-left:10px" onclick="this.parentNode.remove()">✕</a>';d.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);padding:10px 18px;border-radius:99px;z-index:90';document.body.append(d);setTimeout(()=>d.remove(),8000)}
const fired=new Set();setInterval(()=>{const n=new Date(),d=today(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),N=S.set.n,ck=(k,id,t,m)=>{const key=k+id+d+t;if(N[k]&&t&&t<=hm&&t>=hm.slice(0,3)+'00'&&!fired.has(key)&&(t==hm||n.getMinutes()<1)){fired.add(key);toast(m)}};
 dayItems(d).forEach(x=>{if(x.k=='tt')return;const k=x.k;if(x.t&&N[k]&&x.t==hm&&!fired.has(x.i.id+hm)){fired.add(x.i.id+hm);toast(x.l)}});
 if(N.refl&&hm=='20:00'&&!fired.has('r'+d)){fired.add('r'+d);toast('Time for your daily reflection')}if(N.goals&&hm=='21:00'&&!fired.has('g'+d)){fired.add('g'+d);toast('Set your goals for tomorrow')}
 if(N.habit&&hm=='18:00'&&!fired.has('h'+d)){fired.add('h'+d);toast('Check in on your habits')}},20000);
const brand=()=>{const n=new Date();return `<div class="br">ORGANISE ME</div><div class="dt">${n.toLocaleDateString('en-AU',{month:'short'})} <em>${n.getDate()}</em></div><div class="dy">${n.toLocaleDateString('en-AU',{weekday:'short'})} · ${n.getFullYear()}</div>`};
const strip=()=>{const t=new Date(),m=addD(iso(t),-((t.getDay()+6)%7));return `<div class="dpw">`+[...Array(14)].map((_,i)=>{const d=addD(m,i),o=new Date(d+'T12:00');return `<div class="dp ${d==today()?'on':''}" onclick="selD='${d}';cview='week';go('cal')"><small>${o.toLocaleDateString('en-AU',{weekday:'short'}).slice(0,2).toUpperCase()}</small><b>${o.getDate()}</b></div>`}).join('')+'</div>'};
const NAV=[['dash','🏠','Dashboard'],['today','🌷','Today'],['cal','📅','Calendar'],['hw','📚','Homework'],['todo','✅','To-Dos'],['mood','💗','Mood'],['goals','🎯','Daily Goals'],['refl','📖','Reflection'],['habits','🌱','Habits'],['work','🏋️','Workouts'],['timer','⏱️','Study Timer'],['notes','📝','Notes'],['search','🔎','Search'],['settings','⚙️','Settings']];
const phone=()=>S.set.dev=='phone'||(S.set.dev=='auto'&&innerWidth<820);
function go(p){if(p=='sched'){p='cal';cview='week'}page=p;scrollTo(0,0);render()}
function sq(v){Q=v;if(page!='search')page='search';$('#main').innerHTML=P.search();render_nav()}
function render_nav(){const ph=phone(),main=['dash','today','cal','hw'];
 $('#nav').innerHTML=ph?NAV.filter(n=>main.includes(n[0])).map(n=>`<a class="${page==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}<br>${n[2].split(' ')[0]}</a>`).join('')+`<a onclick="mm()">☰<br>More</a>`:brand()+NAV.map(n=>`<a class="${page==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('')}
const mm=()=>md(`<h3>Menu</h3><div class="qa">${NAV.map(n=>`<button onclick="cl();go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')}</div>`);
function render(){document.body.classList.toggle('phone',phone());document.documentElement.classList.toggle('dk',!!S.set.dark);document.body.classList.toggle('dk',!!S.set.dark);document.documentElement.style.setProperty('--ac',S.set.ac);document.documentElement.style.setProperty('--as',S.set.dark?'#43313a':S.set.ac+'2e');
 const a=document.activeElement;if(a&&a.id=='q')return;$('#main').innerHTML=P[page]();render_nav();tu()}
addEventListener('resize',()=>{if(S.set.dev=='auto')render()});render();
setTimeout(()=>{$('#ld').style.opacity=0;setTimeout(()=>$('#ld').remove(),300)},800);
</script></body></html>
